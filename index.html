<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Đồ Vật</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="auth-screen" class="auth-wrapper">
        <div class="auth-box" id="login-box">
            <div class="auth-logo">THIÊN TRƯỜNG SOFTWARE</div>
            <div class="auth-subtitle">QUẢN LÝ KHO & ĐỒ VẬT</div>
            <div class="form-group">
                <label>Email / SĐT</label>
                <input type="text" id="login-email" placeholder="Nhập tài khoản...">
            </div>
            <div class="form-group">
                <label>Mật Khẩu</label>
                <input type="password" id="login-pass" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn-main" id="btn-login">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <nav class="navbar">
            <h3>QUẢN LÝ ĐỒ VẬT</h3>
            <div class="nav-right">
                <span id="user-display-name">👤 Đang tải...</span>
                <button id="btn-logout" class="btn-danger">Đăng Xuất</button>
            </div>
        </nav>

        <div class="container">
            <div id="module-tong-quan" class="module active">
                <h2 class="module-title">Danh Sách Đồ Vật</h2>
                
                <div class="action-bar">
                    <button id="btn-add-item" class="btn-success">➕ Thêm Đồ Vật Mới</button>
                    <input type="text" id="search-item" placeholder="🔍 Tìm kiếm đồ vật...">
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã Đồ Vật</th>
                            <th>Tên Đồ Vật</th>
                            <th>Danh Mục</th>
                            <th>Vị Trí Lưu Trữ</th>
                            <th>Số Lượng</th>
                            <th>Tình Trạng</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
